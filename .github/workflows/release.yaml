# Production release + OIDC canary (Option B) + web deploy to Vercel.
#
# Trusted Publisher on npm must list this filename exactly: release.yaml
# (owner albuquerquesz / repo kubo / environment empty).
# Do not rename without updating npm Trusted Publisher settings.
#
# Production auth: npm Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN.
# Canary auth: same OIDC path, dist-tag oidc-canary only (never latest).
# Rollback: re-add NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} on publish steps.
#
# Web (apps/web → Vercel project "kubo") deploys on the same
# chore(release): x.y.z path, after npm publish succeeds.
# Required secrets/vars (repo Settings → Secrets and variables → Actions):
#   secrets.VERCEL_TOKEN          — Vercel account token (create / full deploy)
#   vars.VERCEL_ORG_ID            — team_… (from `vercel link` / project.json)
#   vars.VERCEL_PROJECT_ID        — prj_… (from `vercel link` / project.json)
#   vars.VERCEL_PRODUCTION_URL    — optional smoke URL (default https://kubo-gamma.vercel.app)
#   secrets.DISCORD_BOT_TOKEN     — Discord bot token
#   vars.DISCORD_GUILD_ID         — Discord server ID
#   vars.DISCORD_CHANNEL_ID       — release notification channel ID
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      oidc_canary:
        description: "If true, publish OIDC canary tag only (no latest, no git tag)"
        type: boolean
        default: false
      canary_version:
        description: "Pre-release version for OIDC canary (empty = 0.0.0-oidc.<run_id>)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # OIDC canary: prove Trusted Publishing without touching latest
  # ---------------------------------------------------------------------------
  oidc-canary:
    name: OIDC publish canary
    if: github.event_name == 'workflow_dispatch' && inputs.oidc_canary == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v
          npm_version=$(npm -v)
          major=$(echo "$npm_version" | cut -d. -f1)
          minor=$(echo "$npm_version" | cut -d. -f2)
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm too old for OIDC Trusted Publishing: $npm_version (need >= 11.5.1)"
            exit 1
          fi

      - name: Guard repository.url for OIDC provenance
        run: |
          EXPECTED='git+https://github.com/albuquerquesz/kubo.git'
          for pkg in apps/cli/package.json packages/types/package.json packages/template-generator/package.json; do
            url=$(jq -r '.repository.url // empty' "$pkg")
            if [ "$url" != "$EXPECTED" ]; then
              echo "Error: $pkg repository.url is '$url', expected '$EXPECTED'"
              exit 1
            fi
            echo "OK $pkg repository.url"
          done

      - name: Resolve canary version
        id: version
        run: |
          if [ -n "${{ inputs.canary_version }}" ]; then
            VERSION="${{ inputs.canary_version }}"
          else
            VERSION="0.0.0-oidc.${{ github.run_id }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Canary version: $VERSION"

          if npm view "create-kubojs@$VERSION" version 2>/dev/null; then
            echo "Error: version $VERSION already exists on npm — pick a new canary version"
            exit 1
          fi

      - name: Snapshot latest dist-tags (must stay unchanged)
        id: pre-latest
        run: |
          LATEST=$(npm view create-kubojs dist-tags.latest)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Pre-canary create-kubojs@latest = $LATEST"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Update package versions for canary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/types
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          cd ../template-generator
          jq --arg v "$VERSION" --arg dep "$VERSION" \
            '.version = $v | .dependencies["@kubojs/types"] = $dep' \
            package.json > tmp.json && mv tmp.json package.json
          cd ../../apps/cli
          jq --arg v "$VERSION" --arg dep "$VERSION" \
            '.version = $v | .dependencies["@kubojs/types"] = $dep | .dependencies["@kubojs/template-generator"] = $dep' \
            package.json > tmp.json && mv tmp.json package.json

      - name: Build packages
        run: |
          cd packages/types && bun run build
          cd ../template-generator && bun run build
          cd ../../apps/cli && bun run build
        env:
          BTS_TELEMETRY: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Publish smoke test (npm, pnpm, bun)
        run: bun run smoke:publish

      # OIDC only — do NOT set NODE_AUTH_TOKEN on canary publish steps
      - name: Publish types (OIDC canary)
        run: cd packages/types && npm publish --access public --provenance --tag oidc-canary

      - name: Publish template-generator (OIDC canary)
        run: cd packages/template-generator && npm publish --access public --provenance --tag oidc-canary

      - name: Publish create-kubojs (OIDC canary)
        run: cd apps/cli && npm publish --access public --provenance --tag oidc-canary

      - name: Publish @kubojs/cli alias (OIDC canary)
        run: |
          cd apps/cli
          ORIGINAL=$(cat package.json)
          jq '.name = "@kubojs/cli"' package.json > tmp.json && mv tmp.json package.json
          npm publish --access public --provenance --tag oidc-canary
          echo "$ORIGINAL" > package.json

      - name: Post-publish npm view verify
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # npm registry can 404 briefly after publish; retry with backoff.
          wait_for_npm_version() {
            local pkg="$1"
            local version="$2"
            local attempts=12
            local delay=5
            local i got
            for i in $(seq 1 "$attempts"); do
              got=$(npm view "$pkg@$version" version 2>/dev/null || true)
              if [ "$got" = "$version" ]; then
                echo "OK $pkg@$got (attempt $i)"
                return 0
              fi
              echo "Waiting for $pkg@$version (attempt $i/$attempts, got='${got:-missing}')..."
              sleep "$delay"
            done
            echo "Error: expected $pkg@$version after $attempts attempts"
            return 1
          }

          for pkg in create-kubojs @kubojs/cli @kubojs/types @kubojs/template-generator; do
            wait_for_npm_version "$pkg" "$VERSION"
          done

          TAG=""
          for i in $(seq 1 12); do
            TAG=$(npm view create-kubojs dist-tags.oidc-canary 2>/dev/null || true)
            if [ "$TAG" = "$VERSION" ]; then
              break
            fi
            echo "Waiting for oidc-canary=$VERSION (attempt $i/12, got='${TAG:-missing}')..."
            sleep 5
          done
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: oidc-canary tag is '$TAG', expected $VERSION"
            exit 1
          fi

          LATEST_NOW=$(npm view create-kubojs dist-tags.latest)
          if [ "$LATEST_NOW" != "${{ steps.pre-latest.outputs.latest }}" ]; then
            echo "Error: latest dist-tag changed from ${{ steps.pre-latest.outputs.latest }} to $LATEST_NOW"
            exit 1
          fi
          echo "latest unchanged: $LATEST_NOW"

      - name: Install smoke from oidc-canary tag
        run: |
          npx --yes create-kubojs@oidc-canary --version

      - name: Canary summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## OIDC canary $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Dist-tag: \`oidc-canary\` (not latest)" >> $GITHUB_STEP_SUMMARY
          echo "- latest still: \`${{ steps.pre-latest.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Auth: OIDC Trusted Publishing (no NODE_AUTH_TOKEN)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Production release on chore(release): x.y.z (OIDC Trusted Publishing)
  # ---------------------------------------------------------------------------
  release:
    name: Release to NPM
    if: >
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v
          npm_version=$(npm -v)
          major=$(echo "$npm_version" | cut -d. -f1)
          minor=$(echo "$npm_version" | cut -d. -f2)
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm too old for OIDC Trusted Publishing: $npm_version (need >= 11.5.1)"
            exit 1
          fi

      - name: Guard repository.url for OIDC provenance
        run: |
          EXPECTED='git+https://github.com/albuquerquesz/kubo.git'
          for pkg in apps/cli/package.json packages/types/package.json packages/template-generator/package.json; do
            url=$(jq -r '.repository.url // empty' "$pkg")
            if [ "$url" != "$EXPECTED" ]; then
              echo "Error: $pkg repository.url is '$url', expected '$EXPECTED'"
              exit 1
            fi
            echo "OK $pkg repository.url"
          done

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%s | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'. Expected semver (x.y.z)"
            exit 1
          fi

      - name: Check if version already exists
        id: check-version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view create-kubojs@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already exists on NPM"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is new"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check-version.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        if: steps.check-version.outputs.exists == 'false'
        run: bun install --frozen-lockfile

      - name: Update types package version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/types
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build types package
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/types && bun run build

      - name: Update template-generator package version and types dependency
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/template-generator
          jq --arg v "$VERSION" --arg dep "^$VERSION" '.version = $v | .dependencies["@kubojs/types"] = $dep' package.json > tmp.json && mv tmp.json package.json

      - name: Build template-generator package
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/template-generator && bun run build

      - name: Update CLI version and workspace dependencies
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd apps/cli
          jq --arg v "$VERSION" --arg dep "^$VERSION" \
            '.version = $v | .dependencies["@kubojs/types"] = $dep | .dependencies["@kubojs/template-generator"] = $dep' \
            package.json > tmp.json && mv tmp.json package.json

      - name: Build CLI
        if: steps.check-version.outputs.exists == 'false'
        run: cd apps/cli && bun run build
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}

      - name: Setup pnpm
        if: steps.check-version.outputs.exists == 'false'
        uses: pnpm/action-setup@v6
        with:
          version: latest

      # Gate all publishes on the smoke so a failure here doesn't leave a
      # partial release on npm (e.g. types/template-generator published but
      # create-kubojs broken).
      - name: Publish smoke test (npm, pnpm, bun)
        if: steps.check-version.outputs.exists == 'false'
        run: bun run smoke:publish

      # Production publish via OIDC Trusted Publishing — no NODE_AUTH_TOKEN.
      # Rollback: restore env NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} on these steps.
      # Explicit --tag latest: npm refuses implicit latest when the new semver
      # is lower than an already-published version (e.g. 0.1.0 after 3.36.3).
      # Auth: NPM_TOKEN (granular/classic write). Skip --provenance for now —
      # combining provenance with a bypass-2FA token was returning 404/permission
      # errors against @kubojs/* even though the packages exist.
      # Repo root .npmrc uses ${NPM_TOKEN}; setup-node injects NODE_AUTH_TOKEN.
      # Export both so local npmrc expansion and the runner userconfig auth work.
      - name: Publish types to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/types && npm publish --access public --tag latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish template-generator to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/template-generator && npm publish --access public --tag latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-kubojs to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd apps/cli && npm publish --access public --tag latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Backward-compat alias: same artifact under @kubojs/cli for older docs/installs.
      - name: Publish @kubojs/cli alias to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd apps/cli
          ORIGINAL=$(cat package.json)
          jq --arg v "$VERSION" '.name = "@kubojs/cli" | .version = $v' package.json > tmp.json && mv tmp.json package.json
          npm publish --access public --tag latest
          echo "$ORIGINAL" > package.json
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish npm view verify
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # npm registry can 404 briefly after publish; retry with backoff.
          wait_for_npm_version() {
            local pkg="$1"
            local version="$2"
            local attempts=12
            local delay=5
            local i got
            for i in $(seq 1 "$attempts"); do
              got=$(npm view "$pkg@$version" version 2>/dev/null || true)
              if [ "$got" = "$version" ]; then
                echo "OK $pkg@$got (attempt $i)"
                return 0
              fi
              echo "Waiting for $pkg@$version (attempt $i/$attempts, got='${got:-missing}')..."
              sleep "$delay"
            done
            echo "Error: expected $pkg@$version after $attempts attempts"
            return 1
          }

          for pkg in create-kubojs @kubojs/cli @kubojs/types @kubojs/template-generator; do
            wait_for_npm_version "$pkg" "$VERSION"
          done

      - name: Create and push tag
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push --tags
          else
            echo "Tag v$VERSION already exists, skipping"
          fi

      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            bunx changelogithub
          else
            echo "Release v$VERSION already exists, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Release v$VERSION Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Auth" >> $GITHUB_STEP_SUMMARY
          echo "OIDC Trusted Publishing (no write token on publish steps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "- [create-kubojs@$VERSION](https://www.npmjs.com/package/create-kubojs/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/cli@$VERSION](https://www.npmjs.com/package/@kubojs/cli/v/$VERSION) (compat alias)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/types@$VERSION](https://www.npmjs.com/package/@kubojs/types/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/template-generator@$VERSION](https://www.npmjs.com/package/@kubojs/template-generator/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "[v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web" >> $GITHUB_STEP_SUMMARY
          echo "Production site deploy runs in the **Deploy web to Vercel** job (same workflow)." >> $GITHUB_STEP_SUMMARY

      - name: Read release notes
        if: steps.check-version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release view "v$RELEASE_VERSION" --json body --jq .body > /tmp/kubo-release-notes.md

      - name: Release Summary
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Release v$VERSION Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Auth" >> $GITHUB_STEP_SUMMARY
          echo "OIDC Trusted Publishing (no write token on publish steps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "- [create-kubojs@$VERSION](https://www.npmjs.com/package/create-kubojs/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/cli@$VERSION](https://www.npmjs.com/package/@kubojs/cli/v/$VERSION) (compat alias)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/types@$VERSION](https://www.npmjs.com/package/@kubojs/types/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@kubojs/template-generator@$VERSION](https://www.npmjs.com/package/@kubojs/template-generator/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "[v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web" >> $GITHUB_STEP_SUMMARY
          echo "Production site deploy runs in the **Deploy web to Vercel** job (same workflow)." >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord
        if: steps.check-version.outputs.exists == 'false'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
          RELEASE_NOTES_FILE: /tmp/kubo-release-notes.md
        run: bun run notify:release

  # ---------------------------------------------------------------------------
  # Production web deploy (Vercel) — same chore(release): gate as npm
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy web to Vercel
    needs: release
    # Run only when the npm release job actually ran and succeeded.
    # (Skipped release commits do not deploy the site.)
    if: >
      always() &&
      needs.release.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # Project Root Directory is apps/web; CLI must run from monorepo root.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Require Vercel credentials
        run: |
          missing=0
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Missing secret VERCEL_TOKEN (Vercel account token with deploy access)"
            missing=1
          fi
          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "::error::Missing repository variable VERCEL_ORG_ID (team_… from vercel project link)"
            missing=1
          fi
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::Missing repository variable VERCEL_PROJECT_ID (prj_… from vercel project link)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID}"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Build on the runner (prebuilt) so CI does not upload node_modules/.next.
      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        id: deploy
        run: |
          set -euo pipefail
          # Last line of CLI output is the deployment URL.
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $url"

      - name: Smoke production site
        env:
          PROD_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          PROD_URL="${PROD_URL:-https://kubo-gamma.vercel.app}"
          smoke() {
            local target="$1"
            local code="000"
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -o /tmp/vercel-smoke-body.html -w "%{http_code}" --max-time 30 "$target/" || echo "000")
              echo "attempt $i: $target/ -> $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Smoke failed for $target (last HTTP $code)"
            return 1
          }
          smoke "$PROD_URL"
          if [ -n "${DEPLOY_URL:-}" ] && [ "$DEPLOY_URL" != "$PROD_URL" ]; then
            smoke "$DEPLOY_URL"
          fi
          # Light content check (prerendered home)
          if ! grep -q 'kubojs' /tmp/vercel-smoke-body.html; then
            echo "::error::Home HTML missing expected brand marker"
            exit 1
          fi
          echo "Smoke OK"

      - name: Deploy summary
        env:
          PROD_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          PROD_URL="${PROD_URL:-https://kubo-gamma.vercel.app}"
          echo "## Web deploy (Vercel)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: [$PROD_URL]($PROD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: [$DEPLOY_URL]($DEPLOY_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Method: \`vercel build --prod\` + \`vercel deploy --prebuilt --prod\`" >> "$GITHUB_STEP_SUMMARY"
