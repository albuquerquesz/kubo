# PR preview publish (label: preview).
#
# Auth strategy (Phase 5 exception): keeps granular NPM_TOKEN for
# pull_request_target publishes. npm Trusted Publisher is configured for
# release.yaml first; pr-preview.yaml is not assumed OIDC-capable on this
# trigger until verified. See docs/spec-npm-trusted-publishing-oidc-migration.md.
#
# Do not rename without updating any Trusted Publisher entry that lists this file.
name: PR Preview

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    name: Publish Preview
    runs-on: ubuntu-latest
    if: github.event.label.name == 'preview'
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v
          npm_version=$(npm -v)
          major=$(echo "$npm_version" | cut -d. -f1)
          minor=$(echo "$npm_version" | cut -d. -f2)
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm too old for OIDC Trusted Publishing: $npm_version (need >= 11.5.1)"
            exit 1
          fi

      - name: Guard repository.url for OIDC provenance
        run: |
          EXPECTED='git+https://github.com/albuquerquesz/kubo.git'
          for pkg in apps/cli/package.json packages/types/package.json packages/template-generator/package.json; do
            url=$(jq -r '.repository.url // empty' "$pkg")
            if [ "$url" != "$EXPECTED" ]; then
              echo "Error: $pkg repository.url is '$url', expected '$EXPECTED'"
              exit 1
            fi
            echo "OK $pkg repository.url"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        env:
          BTS_TELEMETRY: 0

      # Token path (Phase 5 exception for pull_request_target).
      # When preview moves to OIDC, replace with node/npm version check only.
      - name: Verify NPM auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate Preview Version
        id: version
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          BASE_VERSION=$(jq -r '.version' apps/cli/package.json | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PREVIEW_VERSION="${BASE_VERSION}-pr${PR_NUMBER}.${COMMIT_SHA}"
          NPM_TAG="pr${PR_NUMBER}"

          echo "version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "pr=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

          echo "Preview version: $PREVIEW_VERSION"
          echo "NPM tag: $NPM_TAG"

      - name: Update types package version
        run: |
          cd packages/types
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build types package
        run: cd packages/types && bun run build

      - name: Publish types to NPM
        run: cd packages/types && npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BTS_TELEMETRY: 0

      - name: Update template-generator package version and types dependency
        run: |
          cd packages/template-generator
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v | .dependencies["@kubojs/types"] = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build template-generator package
        run: cd packages/template-generator && bun run build

      - name: Publish template-generator to NPM
        run: cd packages/template-generator && npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BTS_TELEMETRY: 0

      - name: Update CLI package version and dependencies
        run: |
          cd apps/cli
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v | .dependencies["@kubojs/types"] = $v | .dependencies["@kubojs/template-generator"] = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build CLI
        run: cd apps/cli && bun run build
        env:
          BTS_TELEMETRY: 0

      - name: Publish create-kubojs to NPM
        run: cd apps/cli && npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BTS_TELEMETRY: 0

      - name: Publish @kubojs/cli alias to NPM
        run: |
          cd apps/cli
          ORIGINAL=$(cat package.json)
          jq '.name = "@kubojs/cli"' package.json > tmp.json && mv tmp.json package.json
          npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
          echo "$ORIGINAL" > package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BTS_TELEMETRY: 0

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "PR Preview Release"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## PR Preview Release

            A preview version has been published for this PR.

            | Package | Version | NPM Tag |
            |---------|---------|---------|
            | `create-kubojs` | `${{ steps.version.outputs.version }}` | `pr${{ steps.version.outputs.pr }}` |
            | `@kubojs/cli` (alias) | `${{ steps.version.outputs.version }}` | `pr${{ steps.version.outputs.pr }}` |
            | `@kubojs/types` | `${{ steps.version.outputs.version }}` | `pr${{ steps.version.outputs.pr }}` |
            | `@kubojs/template-generator` | `${{ steps.version.outputs.version }}` | `pr${{ steps.version.outputs.pr }}` |

            **Commit:** `${{ steps.version.outputs.commit }}`

            ### Install

            ```bash
            # Using the PR tag (always gets latest for this PR)
            bun create kubojs@pr${{ steps.version.outputs.pr }}
            bunx create-kubojs@pr${{ steps.version.outputs.pr }}
            npx create-kubojs@pr${{ steps.version.outputs.pr }}

            # Using exact version
            bunx create-kubojs@${{ steps.version.outputs.version }}
            npx create-kubojs@${{ steps.version.outputs.version }}
            ```

            ### NPM Links
            - [create-kubojs@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/create-kubojs/v/${{ steps.version.outputs.version }})
            - [@kubojs/cli@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@kubojs/cli/v/${{ steps.version.outputs.version }}) (compat alias)
            - [@kubojs/types@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@kubojs/types/v/${{ steps.version.outputs.version }})
            - [@kubojs/template-generator@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@kubojs/template-generator/v/${{ steps.version.outputs.version }})

            ---
            *To publish a new preview after more commits, remove and re-add the `preview` label.*
