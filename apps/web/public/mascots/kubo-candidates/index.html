<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kubo mascot candidates</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #000;
        color: #f1f1f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        background: #000;
      }

      main {
        width: min(100%, 1080px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.25rem, 4vw, 2rem);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      figure {
        margin: 0;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border: 1px solid #252525;
        border-radius: 12px;
      }

      figcaption {
        padding: 8px 2px 0;
        color: #c49314;
        font-size: 0.875rem;
        font-weight: 700;
      }

      @media (min-width: 720px) {
        body {
          padding: 32px;
        }

        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kubo mascot candidates</h1>
      <section class="grid" aria-label="Kubo mascot candidates">
        <figure>
          <img src="a1.png" alt="Candidato A1" />
          <figcaption>A1</figcaption>
        </figure>
        <figure>
          <img src="a2.png" alt="Candidato A2" />
          <figcaption>A2</figcaption>
        </figure>
        <figure>
          <img src="b1.png" alt="Candidato B1" />
          <figcaption>B1</figcaption>
        </figure>
        <figure>
          <img src="b2.png" alt="Candidato B2" />
          <figcaption>B2</figcaption>
        </figure>
        <figure>
          <img src="c1.png" alt="Candidato C1" />
          <figcaption>C1</figcaption>
        </figure>
        <figure>
          <img src="c2.png" alt="Candidato C2" />
          <figcaption>C2</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
